<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="maindiv">
    <h2 id="heading" class="heading">My To-Do List</h2>
    <form action="" id="form" class="form">
        <input type="text" id="TaskInput">
        <button id="TaskBtn">Add Task</button>
    </form>
    <p id="Message"></p>
    <div class="calculations">
    <p id="TotalTasks" class="TotalTasks">Total Tasks: 0</p>
    <p id="CompletedTasks" class="CompletedTasks">Completed: 0</p>
    </div>
    <ul id="TaskList" class="flex items-center sm:flex-col bg-red dark:bg-[#] rounded-sm rounded-[12px]"></ul>
    <button id="ClearBtn" class="ClearBtn">Clear All</button>
 
    <script src="script.js"></script>
</body>
</html>
